{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4>Calcular IMC</h4>
            </div>

            <div class="card-body">

                <form method="POST" action="/calcular">

                    <!-- Peso -->
                    <div class="mb-3">
                        <label class="form-label">Peso (kg)</label>
                        <input type="number" step="0.1" class="form-control" name="peso" required>
                    </div>

                    <!-- Estatura -->
                    <div class="mb-3">
                        <label class="form-label">Estatura (m)</label>
                        <input type="number" step="0.01" class="form-control" name="estatura" required>
                    </div>

                    <!-- Botón -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">
                            Calcular IMC
                        </button>
                    </div>

                </form>

                <!-- RESULTADO -->
                {% if imc %}
                <hr>

                <div id="resultado-imc" class="alert alert-info text-center">
                    <h5>Tu IMC es: {{ imc }}</h5>
                    <p><strong>Clasificación:</strong> {{ clasificacion }}</p>
                    <p>{{ recomendacion }}</p>
                </div>
                {% endif %}

            </div>
        </div>

    </div>
</div>

{% endblock %}
